[package]
name = "honeypot-core"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
dotenv = "0.15"
tokio-util = "0.7"